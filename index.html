.o.w{background:var(--no);border-color:var(--no);color:#fff}

.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}

.res{background:var(--card);border:2px solid var(--pr);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}

const app=document.getElementById("app");
let cur=null,ans=[],done=false;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){
 cur=null;window.scrollTo(0,0);
 app.innerHTML='<h1>اختبارات الشبكة المتقدمة</h1><p class="sub">اختر الملزمة وابدأ اختبار نفسك</p><div class="note"><b>ملاحظة</b>هذه الاختبارات غير معتمدة من الدكتور، وهي فقط لمساعدة الطلاب على تثبيت المعلومات واختبار أنفسهم.</div>'+
 L.map((l,i)=>'<button class="lec" data-i="'+i+'"><strong>'+l.t+'</strong><span>'+l.q.length+' سؤال</span></button>').join("");
 app.querySelectorAll(".lec").forEach(b=>b.onclick=()=>start(+b.dataset.i));
}
function start(i){
 cur=L[i];done=false;ans=cur.q.map(()=>-1);
 cur.s=cur.q.map(q=>{const o=sh(q.slice(1).map((t,k)=>({t,c:k===0})));return o});
 render();window.scrollTo(0,0);
}
function render(){
 const n=cur.q.length,got=ans.filter(a=>a>=0).length;
 let ok=0;
 const qs=cur.q.map((q,qi)=>{
  const o=cur.s[qi],a=ans[qi],right=a>=0&&o[a].c;if(right)ok++;
  const cls=done?(right?"ok":"no"):"";
  return '<div class="q '+cls+'"><p class="qt">'+(qi+1)+'. '+q[0]+'</p>'+o.map((x,k)=>{
   let c="o";if(done){if(x.c)c+=" c";else if(k===a)c+=" w"}else if(k===a)c+=" sel";
   return '<button class="'+c+'" data-q="'+qi+'" data-k="'+k+'"'+(done?" disabled":"")+'>'+x.t+'</button>'}).join("")+
   (done&&a<0?'<span class="tag">لم تجب على هذا السؤال</span>':"")+'</div>'}).join("");
 app.innerHTML='<div class="top"><h2>'+cur.t+'</h2><button class="btn g" id="h">الرئيسية</button></div>'+
 (done?'<div class="res"><div class="n">'+ok+' / '+n+'</div>أجبت على '+got+' من '+n+' سؤال، والإجابات الصحيحة '+ok+'</div>':"")+qs+
 '<div class="bar">'+(done?'<button class="btn" id="r">إعادة الاختبار</button><button class="btn g" id="h2">الرئيسية</button>':'<span>تمت الإجابة: '+got+' / '+n+'</span><button class="btn" id="c">تصحيح</button>')+'</div>';
 app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(done)return;const y=window.scrollY;ans[+b.dataset.q]=+b.dataset.k;render();window.scrollTo(0,y)});
 const $=id=>document.getElementById(id);
 $("h").onclick=home;
 if($("h2"))$("h2").onclick=home;
 if($("r"))$("r").onclick=()=>start(L.indexOf(cur));
 if($("c"))$("c").onclick=()=>{done=true;render();window.scrollTo(0,0)};
}
home();
</script>
